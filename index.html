<!DOCTYPE html>
<html>
<head>
    <title>FG-WHRS Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🔥 Flue Gas Heat Recovery Tool</h1>

<div class="container">
    <input id="T" placeholder="Temperature (K)">
    <input id="v" placeholder="Velocity (m/s)">
    <input id="D" placeholder="Diameter (m)">
    <input id="A" placeholder="Area (m²)">
    <input id="L" placeholder="Length (m)">
    <input id="flow_area" placeholder="Flow Area (m²)">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>
</div>

<script src="script.js"></script>

</body>
</html>
