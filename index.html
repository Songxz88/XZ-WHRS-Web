<body>

<div class="header">
    🔥 FG-WHRS Pro | Industrial Simulator
</div>

<div class="layout">

    <!-- 左：控制面板 -->
    <div class="panel control">
        <h2>⚙️ Control Panel</h2>
        <input id="T" placeholder="Temperature (K)" value="400">
        <input id="v" placeholder="Velocity (m/s)" value="8">
        <input id="D" placeholder="Diameter (m)" value="0.05">
        <input id="A" placeholder="Area (m²)" value="20">
        <input id="L" placeholder="Length (m)" value="10">
        <input id="flow_area" placeholder="Flow Area (m²)" value="0.5">

        <button onclick="calculate()">▶ Run</button>
    </div>

    <!-- 中：图表 -->
    <div class="panel chart">
        <h2>📈 Performance Curve</h2>
        <canvas id="chart"></canvas>
    </div>

    <!-- 右：结果 -->
    <div class="panel result">
        <h2>📊 Key Metrics</h2>
        <div id="cards"></div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
