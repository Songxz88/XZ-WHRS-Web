<!DOCTYPE html>
<html>
<head>
    <title>FG-WHRS Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    🔥 FG-WHRS Pro System
</div>

<div class="container">

    <!-- 左侧输入 -->
    <div class="panel left">
        <h2>⚙️ Input Panel</h2>

        <label>Temperature (K)</label>
        <input id="T" value="400">

        <label>Velocity (m/s)</label>
        <input id="v" value="8">

        <label>Diameter (m)</label>
        <input id="D" value="0.05">

        <label>Heat Area (m²)</label>
        <input id="A" value="20">

        <label>Length (m)</label>
        <input id="L" value="10">

        <label>Flow Area (m²)</label>
        <input id="flow_area" value="0.5">

        <button onclick="calculate()">▶ Run Simulation</button>
    </div>

    <!-- 右侧结果 -->
    <div class="panel right">
        <h2>📊 System Results</h2>

        <div class="grid" id="result">
            <!-- 动态生成 -->
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
