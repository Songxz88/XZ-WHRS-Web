<!DOCTYPE html>
<html>
<head>
    <title>FG-WHRS Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    🔥 FG-WHRS Pro | Flue Gas Recovery System
</div>

<div class="main">

    <!-- 左侧控制面板 -->
    <div class="panel input-panel">
        <h2>⚙️ Input Parameters</h2>

        <label>Temperature (K)</label>
        <input id="T">

        <label>Velocity (m/s)</label>
        <input id="v">

        <label>Diameter (m)</label>
        <input id="D">

        <label>Heat Area (m²)</label>
        <input id="A">

        <label>Length (m)</label>
        <input id="L">

        <label>Flow Area (m²)</label>
        <input id="flow_area">

        <button onclick="calculate()">Run Simulation</button>
    </div>

    <!-- 右侧结果面板 -->
    <div class="panel output-panel">
        <h2>📊 Results</h2>
        <div id="result">No data yet</div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
